<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开心快乐每一天 · 观影导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 {
    font-size: 30px; font-weight: 700; letter-spacing: 2px;
    margin-bottom: 12px; text-shadow: 0 2px 12px rgba(0,0,0,.4);
  }
  .header .subtitle { font-size: 14px; color: #b8d4dd; line-height: 1.8; }
  .save-box {
    margin-top: 16px; display: inline-block; padding: 10px 22px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px; font-size: 15px; backdrop-filter: blur(6px);
  }
  .save-box b { color: #ffd76e; font-size: 17px; letter-spacing: 1px; }
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px; width: 100%; max-width: 620px; margin-top: 8px;
  }
  .card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    text-decoration: none; color: #fff;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    backdrop-filter: blur(8px);
  }
  .card:hover {
    transform: translateY(-3px); background: rgba(255,255,255,.16);
    box-shadow: 0 8px 22px rgba(0,0,0,.35);
  }
  .card .left { display: flex; align-items: center; gap: 10px; }
  .card .icon {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px;
    background: linear-gradient(135deg, #ff6a88, #ff99ac);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .card:nth-child(2) .icon { background: linear-gradient(135deg,#4facfe,#00f2fe); }
  .card:nth-child(3) .icon { background: linear-gradient(135deg,#43e97b,#38f9d7); }
  .card:nth-child(4) .icon { background: linear-gradient(135deg,#fa709a,#fee140); }
  .card:nth-child(5) .icon { background: linear-gradient(135deg,#a18cd1,#fbc2eb); }
  .card .title { font-size: 14px; font-weight: 600; }
  .card .tag { font-size: 11px; color: #cfe6ee; margin-top: 2px; }
  .card .arrow { font-size: 17px; color: #ffd76e; }
  .footer { margin-top: 40px; font-size: 12px; color: #8fb0ba; text-align: center; line-height: 1.8; }

  /* 引导遮罩层 */
  #guide-mask {
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(8, 12, 20, .92);
    backdrop-filter: blur(4px);
    color: #fff;
  }
  #guide-mask.show { display: block; }
  /* 顶部指向箭头 */
  .guide-arrow {
    position: fixed; top: 12px; right: 16px;
    display: flex; flex-direction: column; align-items: center;
    color: #ffd76e;
    animation: bounce 1.1s ease-in-out infinite;
  }
  .guide-arrow .ico { font-size: 42px; line-height: 1; }
  .guide-arrow .dots { font-size: 26px; font-weight: 700; letter-spacing: 3px; margin-top: -4px; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  /* 居中卡片 */
  .guide-card {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: calc(100% - 48px); max-width: 340px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 20px;
    padding: 32px 26px;
    text-align: center;
  }
  .guide-card .g-emoji { font-size: 40px; margin-bottom: 14px; }
  .guide-card .g-title { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .guide-card .g-sub { font-size: 13px; color: #9fb4c4; margin-bottom: 26px; }
  .guide-steps { text-align: left; }
  .guide-steps .step {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0;
    font-size: 15px; line-height: 1.5;
  }
  .guide-steps .step + .step { border-top: 1px solid rgba(255,255,255,.08); }
  .guide-steps .num {
    flex-shrink: 0;
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg,#ffd76e,#ffb84d); color: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }
  .guide-steps .dots { color: #ffd76e; font-weight: 700; letter-spacing: 2px; }
  .guide-card .g-tip {
    margin-top: 22px; font-size: 12px; color: #7f93a3; line-height: 1.6;
  }
  .guide-close-btn {
    margin-top: 24px;
    width: 100%;
    padding: 13px 0;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg,#ffd76e,#ffb84d);
    color: #1a1a1a;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .15s ease;
  }
  .guide-close-btn:active { opacity: .8; }
</style>
</head>
